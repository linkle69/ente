name: "Build Ensu APK (fork)"

# Minimal Android build for this fork: builds a release APK (signed with the
# repo's debug.keystore, since there are no production secrets here) and
# uploads it as a workflow artifact.

on:
    workflow_dispatch:
    push:
        branches:
            - syntax-highlighting

env:
    NDK_VERSION: "27.3.13750724"

jobs:
    build-android:
        runs-on: ubuntu-latest
        timeout-minutes: 120

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup JDK 17
              uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
              with:
                  distribution: "temurin"
                  java-version: "17"

            - name: Setup Android SDK
              uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

            - name: Install NDK
              run: |
                  echo "y" | sdkmanager --install "ndk;${{ env.NDK_VERSION }}"
                  echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV

            - name: Install Vulkan build dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libvulkan-dev glslc spirv-headers

            - name: Setup Rust cache
              uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
              with:
                  workspaces: rust
                  shared-key: ensu-android-fork

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v4

            - name: Generate bindings
              working-directory: rust
              run: cargo codegen native

            - name: Build release APK
              working-directory: android
              run: ./gradlew :ensu:app:assembleRelease

            - name: Upload APK
              uses: actions/upload-artifact@v4
              with:
                  name: ensu-apk
                  path: android/apps/ensu/app/build/outputs/apk/release/app-release.apk
                  if-no-files-found: error
